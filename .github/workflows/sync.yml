name: Refresh project catalog
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Fetch public catalog from Notion
        id: sync
        continue-on-error: true
        run: bun run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
      - run: bun test && bun run check && bun run build && bun scripts/smoke.ts
      - name: Commit the usable snapshot
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/projects.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh project catalog'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN pushes do not trigger other workflows or all provider webhooks.
      - name: Trigger Dokploy explicitly
        if: steps.commit.outputs.changed == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: bun scripts/deploy.ts
      - name: Report incomplete synchronization
        if: steps.sync.outcome == 'failure'
        run: |
          echo 'Some sources could not be refreshed. The last usable counts were retained.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
