server {
 listen 80 default_server;
 server_name _;
 root /usr/share/nginx/html;
 error_page 404 /404.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /posts { return 301 https://anvian.net/blog/; }
 location = /posts/ { return 301 https://anvian.net/blog/; }
 location ~ ^/posts/(.+?)/?$ { return 301 https://anvian.net/blog/$1/$is_args$args; }
 location /telemetry/ {
  proxy_pass https://telemetry.anvian.net/;
  proxy_ssl_server_name on;
  proxy_set_header Host telemetry.anvian.net;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location /_astro/ { try_files $uri =404; expires 1y; }
 location / { try_files $uri $uri/ =404; }
}
# Attach blog.anvian.net to this application only after verifying the new site.
server {
 listen 80;
 server_name blog.anvian.net;
 location = / { return 301 https://anvian.net/blog/$is_args$args; }
 location = /posts { return 301 https://anvian.net/blog/$is_args$args; }
 location = /posts/ { return 301 https://anvian.net/blog/$is_args$args; }
 location ~ ^/(tags|categories)(/|$) { return 301 https://anvian.net/blog/$is_args$args; }
 location = /index.xml { return 301 https://anvian.net/rss.xml$is_args$args; }
 location = /posts/index.xml { return 301 https://anvian.net/rss.xml$is_args$args; }
 location ~ ^/posts/(.+?)/?$ { return 301 https://anvian.net/blog/$1/$is_args$args; }
 location / { return 301 https://anvian.net$request_uri; }
}
